%YAML:1.0

#-ORB 特征与实例标签关联-------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 535.4
Camera1.fy: 539.2
Camera1.cx: 320.1
Camera1.cy: 247.6

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.0747

# Depth map values factor
RGBD.DepthMapFactor: 5000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0


# TUM imread uses BGR. Semantic masks are computed after all SLAM resizing.
Run.Viewer: 1
# Master switch defaults to 0 if absent. MaskOnly defaults to 1.
Dynamic.Enable: 1
Dynamic.MaskOnly: 1
# MaskOnly=0 reserves geometry detection; currently also preserves all features.
# Model defaults to $HOME/models/yolo/yolo11s-seg.onnx
SemanticMask.Mode: "selected"
SemanticMask.Classes: [0]
SemanticMask.Confidence: 0.25
SemanticMask.NmsIoU: 0.7
SemanticMask.MaxDetections: 300
# Radius in CURRENT SLAM image pixels; 0 disables dilation.
SemanticMask.DilationRadius: 0
SemanticMask.Visualize: 1
SemanticMask.Debug: 0
SemanticMask.OutputDirectory: "outputs/instance-association/debug"

# Dynamic.Enable=1 enables association and always disables feature masking.
# Writes per-frame overlay, uint16 labels and CSV only when explicitly enabled.
SemanticMask.AssociationDebug: 0
